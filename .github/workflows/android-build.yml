name: Android Build & Firebase Distribution

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout du code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Installer Ruby pour Fastlane
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'  # éviter warning Fastlane

      # 3️⃣ Installer les dépendances
      - name: Install dependencies
        run: |
          gem install bundler
          bundle install
          npm install -g firebase-tools

      # 4️⃣ Rendre gradlew exécutable
      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      # 5️⃣ Setup Android SDK (nécessaire pour Gradle)
      - name: Setup Android SDK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          script: echo "SDK Ready" # obligatoire pour l'action

      # 6️⃣ Build et distribution via Fastlane
      - name: Build & distribute via Fastlane
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bundle exec fastlane android distribute