name: Android Build & Firebase Distribution

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1️⃣ Télécharger le code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Installer Node (React Native / Expo)
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3️⃣ Installer les dépendances npm
      - name: Install npm dependencies
        run: npm install

      # 4️⃣ Installer Java pour Android
      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # 5️⃣ Installer Ruby pour Fastlane
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      # 6️⃣ Installer Bundler + dépendances Ruby
      - name: Install Ruby dependencies
        run: |
          gem install bundler
          bundle install

      # 7️⃣ Installer Firebase CLI
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 8️⃣ Donner permission à Gradle
      - name: Grant permission to gradlew
        run: chmod +x android/gradlew

      # 9️⃣ Lancer Fastlane (build + upload Firebase)
      - name: Build & Distribute APK
        run: bundle exec fastlane android distribute
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}