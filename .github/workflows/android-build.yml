name: Android Build & Firebase Distribution

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout du code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Installer Ruby (pour Fastlane)
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      # 3️⃣ Installer les dépendances
      - name: Install dependencies
        run: |
          gem install bundler
          bundle install
          npm install -g firebase-tools

      # 4️⃣ Setup Java & Gradle
      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget https://services.gradle.org/distributions/gradle-8.3-bin.zip -P /tmp
          unzip -qq /tmp/gradle-8.3-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.3/bin" >> $GITHUB_PATH

      # 5️⃣ Build et distribution automatique via Fastlane
      - name: Build & distribute via Fastlane
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Incrémentation automatique du versionCode
          bundle exec fastlane android bump_version

          # Build Debug et upload Firebase
          bundle exec fastlane android distribute_debug

          # Build Release et upload Firebase si push sur main
          if [[ $GITHUB_REF == "refs/heads/main" ]]; then
            bundle exec fastlane android distribute_release
          fi