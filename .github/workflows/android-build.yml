name: Android Build & Firebase Distribution

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1️⃣ Télécharger le projet
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Installer Java (requis pour Android)
      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3️⃣ Installer Ruby pour Fastlane
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      # 4️⃣ Installer dépendances
      - name: Install dependencies
        run: |
          gem install bundler
          bundle install
          npm install -g firebase-tools

      # 5️⃣ Donner permission au gradlew
      - name: Grant permission to Gradle
        run: chmod +x android/gradlew

      # 6️⃣ Build APK
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      # 7️⃣ Distribution Firebase
      - name: Distribute to Firebase
        run: bundle exec fastlane android distribute
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}